<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Focus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-glass: rgba(255, 255, 255, 0.06);
            --bg-glass-hover: rgba(255, 255, 255, 0.12);
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #6366f1;
            --accent-rgb: 99, 102, 241;
            --radius: 14px;
            --radius-sm: 10px;
            --transition: all 0.2s ease;
            --select-bg: #1a1a1a;
            --select-text: #ffffff;
        }
        
        .light-theme {
            --bg-primary: #f5f5f5;
            --bg-glass: rgba(255, 255, 255, 0.8);
            --bg-glass-hover: rgba(255, 255, 255, 0.95);
            --bg-card: rgba(255, 255, 255, 0.6);
            --bg-card-hover: rgba(255, 255, 255, 0.8);
            --text-primary: #1a1a1a;
            --text-secondary: rgba(0, 0, 0, 0.7);
            --text-muted: rgba(0, 0, 0, 0.4);
            --border-color: rgba(0, 0, 0, 0.08);
            --select-bg: #ffffff;
            --select-text: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        .wallpaper {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .wallpaper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, var(--wallpaper-dim, 0.3));
            backdrop-filter: blur(var(--wallpaper-blur, 0px));
            -webkit-backdrop-filter: blur(var(--wallpaper-blur, 0px));
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .header { text-align: center; padding: 30px 0 20px; }
        .time { font-size: clamp(60px, 14vw, 100px); font-weight: 300; letter-spacing: -3px; color: var(--text-primary); }
        .greeting { font-size: clamp(18px, 4vw, 24px); color: var(--text-secondary); margin-top: 4px; font-weight: 400; }
        .date { font-size: 14px; color: var(--text-muted); margin-top: 6px; }

        /* Widget System */
        .widgets-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            max-height: 140px;
        }
        .widget {
            position: relative;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px 14px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .widget-gear {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
            z-index: 5;
        }
        .widget:hover .widget-gear { opacity: 0.7; }
        .widget-gear:hover { opacity: 1 !important; background: var(--bg-glass-hover); }
        @media (hover: none) {
            .widget-gear { opacity: 0.4; }
        }

        /* Clock Widget */
        .widget-clock { justify-content: center; align-items: center; }
        .widget-clock-time { font-size: 42px; font-weight: 300; letter-spacing: -2px; line-height: 1; }
        .widget-clock-seconds { font-size: 20px; font-weight: 300; color: var(--text-secondary); vertical-align: super; margin-left: 2px; }
        .widget-clock-ampm { font-size: 14px; font-weight: 400; color: var(--text-secondary); margin-left: 4px; }
        .widget-clock-date { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .widget-clock-greeting { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }

        /* Calendar Widget */
        .widget-calendar { padding: 10px 12px; }
        .widget-calendar-header { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; text-align: center; }
        .widget-calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; font-size: 10px; text-align: center; }
        .widget-calendar-day-header { color: var(--text-muted); font-weight: 500; padding: 2px 0; }
        .widget-calendar-day { color: var(--text-secondary); padding: 2px 0; line-height: 1.4; }
        .widget-calendar-day.other-month { opacity: 0.3; }
        .widget-calendar-day.today { 
            background: var(--accent); 
            color: white; 
            border-radius: 50%; 
            width: 18px; 
            height: 18px; 
            line-height: 18px;
            margin: 0 auto;
            font-weight: 600;
        }

        /* Weather Widget */
        .widget-weather { justify-content: center; }
        .widget-weather-main { display: flex; align-items: center; gap: 8px; }
        .widget-weather-icon { font-size: 36px; line-height: 1; }
        .widget-weather-temp { font-size: 36px; font-weight: 300; line-height: 1; }
        .widget-weather-unit { font-size: 16px; color: var(--text-secondary); }
        .widget-weather-desc { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .widget-weather-location { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .widget-weather-error { font-size: 12px; color: var(--text-muted); text-align: center; }

        /* Finance Widget */
        .widget-finance { justify-content: center; }
        .widget-finance-symbol { font-size: 12px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; }
        .widget-finance-price { font-size: 28px; font-weight: 400; line-height: 1.2; }
        .widget-finance-change { font-size: 14px; font-weight: 500; margin-top: 2px; }
        .widget-finance-change.positive { color: #22c55e; }
        .widget-finance-change.negative { color: #ef4444; }
        .widget-finance-name { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .widget-finance-market { font-size: 10px; color: var(--text-muted); }
        .widget-finance-error { font-size: 12px; color: var(--text-muted); }

        /* Widget Responsive */
        @media (max-width: 900px) {
            .widgets-container { gap: 8px; }
            .widget { padding: 10px 12px; min-height: 100px; }
            .widget-clock-time { font-size: 32px; }
            .widget-weather-icon, .widget-weather-temp { font-size: 28px; }
            .widget-finance-price { font-size: 24px; }
            .widget-calendar-grid { font-size: 9px; }
        }
        @media (max-width: 600px) {
            .widgets-container { 
                grid-template-columns: repeat(2, 1fr); 
                max-height: none;
            }
            .widget { min-height: 90px; }
            .widget-clock-time { font-size: 28px; }
            .widget-clock-seconds { font-size: 14px; }
            .widget-weather-icon, .widget-weather-temp { font-size: 24px; }
            .widget-finance-price { font-size: 22px; }
        }

        .search-container { max-width: 600px; margin: 0 auto 24px; position: relative; }
        .search-box { position: relative; display: flex; align-items: center; }
        .search-input {
            width: 100%; padding: 14px 20px 14px 48px; font-size: 15px; font-family: inherit;
            background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid var(--border-color);
            border-radius: 50px; color: var(--text-primary); outline: none; transition: var(--transition);
        }
        .search-input:focus { background: var(--bg-glass-hover); border-color: rgba(255,255,255,0.15); }
        .search-input::placeholder { color: var(--text-muted); }
        .search-icon { position: absolute; left: 18px; color: var(--text-muted); pointer-events: none; }
        .search-hint { position: absolute; right: 16px; font-size: 12px; color: var(--text-muted); opacity: 0.6; }

        .search-results {
            position: absolute; top: calc(100% + 8px); left: 0; right: 0;
            background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid var(--border-color);
            border-radius: var(--radius); max-height: 320px; overflow-y: auto; z-index: 100; display: none;
        }
        .search-results.show { display: block; }
        .search-result { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; transition: var(--transition); }
        .search-result:hover { background: var(--bg-glass-hover); }
        .search-result img { width: 28px; height: 28px; border-radius: 8px; background: var(--bg-card); }
        .search-result-info { flex: 1; min-width: 0; }
        .search-result-name { font-size: 14px; }
        .search-result-path { font-size: 11px; color: var(--text-muted); }

        .favorites-section { margin-bottom: 20px; }
        .section-label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px; padding-left: 4px; }
        .favorites-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .favorite-chip { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); cursor: pointer; transition: var(--transition); text-decoration: none; color: var(--text-primary); }
        .favorite-chip:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
        .favorite-chip img { width: 24px; height: 24px; border-radius: 6px; }
        .favorite-chip span { font-size: 13px; font-weight: 500; }

        .tab-nav-wrapper { position: relative; margin-bottom: 20px; }
        .tab-nav-scroll-btn {
            position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px;
            background: var(--bg-glass); backdrop-filter: blur(16px); border: 1px solid var(--border-color);
            border-radius: 50%; color: var(--text-secondary); cursor: pointer; z-index: 10;
            display: none; align-items: center; justify-content: center; transition: var(--transition);
        }
        .tab-nav-scroll-btn:hover { background: var(--bg-glass-hover); color: var(--text-primary); }
        .tab-nav-scroll-btn.left { left: -16px; }
        .tab-nav-scroll-btn.right { right: -16px; }
        .tab-nav-scroll-btn.visible { display: flex; }
        
        .tab-nav {
            display: flex; gap: 4px; padding: 6px; background: var(--bg-glass); backdrop-filter: blur(16px);
            border: 1px solid var(--border-color); border-radius: var(--radius); overflow-x: auto;
            scrollbar-width: none; scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        }
        .tab-nav::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px;
            font-family: inherit; font-weight: 500; background: transparent; border: none;
            border-radius: var(--radius-sm); color: var(--text-secondary); cursor: pointer;
            white-space: nowrap; transition: var(--transition); flex-shrink: 0;
        }
        .tab-btn:hover { color: var(--text-primary); background: var(--bg-card); }
        .tab-btn.active { background: var(--bg-card-hover); color: var(--text-primary); }
        .tab-btn.drag-over { background: rgba(var(--accent-rgb), 0.3); border: 2px dashed var(--accent); }
        .tab-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .tab-add { margin-left: auto; color: var(--text-muted); padding: 10px 14px; }
        .tab-add:hover { color: var(--accent); }

        .category-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; }
        .category-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; }
        .category-dot { width: 10px; height: 10px; border-radius: 50%; }
        .category-actions { display: flex; gap: 4px; }

        .subfolder-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .subfolder-chip { display: flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 13px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; color: var(--text-secondary); cursor: pointer; transition: var(--transition); }
        .subfolder-chip:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .subfolder-chip.active { background: var(--accent); border-color: var(--accent); color: white; }
        .subfolder-chip svg { width: 14px; height: 14px; opacity: 0.7; }
        .subfolder-count { font-size: 11px; background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 8px; }
        .subfolder-chip.active .subfolder-count { background: rgba(255,255,255,0.25); }
        .subfolder-add { border-style: dashed; color: var(--text-muted); }
        .subfolder-add:hover { border-color: var(--accent); color: var(--accent); }

        .icons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; }
        .icon-item { display: flex; flex-direction: column; align-items: center; padding: 14px 8px; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); text-decoration: none; background: transparent; user-select: none; }
        .icon-item:hover { background: var(--bg-glass); }
        .icon-item:active { transform: scale(0.96); }
        .icon-item.dragging { opacity: 0.5; transform: scale(0.95); }
        .icon-item.drag-over { background: rgba(var(--accent-rgb), 0.2); border: 2px dashed var(--accent); }
        .icon-item.folder-drop-target { background: rgba(var(--accent-rgb), 0.4); transform: scale(1.1); box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.5); }
        
        .icon-img-wrap { width: 52px; height: 52px; border-radius: var(--radius-sm); background: white; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); overflow: hidden; position: relative; }
        .icon-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .icon-img-wrap.placeholder { font-size: 20px; font-weight: 600; color: white; }
        .icon-favorite { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; background: #fbbf24; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; color: white; }
        .icon-label { font-size: 11px; color: var(--text-secondary); text-align: center; line-height: 1.3; max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }

        .icon-add { border: 2px dashed var(--border-color); background: transparent; }
        .icon-add:hover { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.1); }
        .icon-add .icon-img-wrap { background: transparent; box-shadow: none; color: var(--text-muted); }
        .icon-add:hover .icon-img-wrap { color: var(--accent); }

        .btn { padding: 10px 18px; font-size: 14px; font-family: inherit; font-weight: 500; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; gap: 6px; }
        .btn-icon { width: 32px; height: 32px; padding: 0; background: transparent; color: var(--text-muted); border-radius: 8px; justify-content: center; }
        .btn-icon:hover { background: var(--bg-card); color: var(--text-primary); }
        .btn-icon.danger:hover { color: #ef4444; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-small { padding: 6px 12px; font-size: 12px; }

        .fab { position: fixed; bottom: 80px; right: 20px; width: 52px; height: 52px; background: var(--accent); color: white; border: none; border-radius: 50%; cursor: pointer; box-shadow: 0 4px 20px rgba(var(--accent-rgb), 0.4); z-index: 50; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .fab:hover { transform: scale(1.1); }
        .settings-btn { position: fixed; bottom: 20px; right: 20px; width: 44px; height: 44px; background: var(--bg-glass); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 50%; color: var(--text-secondary); cursor: pointer; z-index: 50; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .settings-btn:hover { background: var(--bg-glass-hover); color: var(--text-primary); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: rgba(25, 25, 25, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: var(--radius); width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; }
        .light-theme .modal { background: rgba(255, 255, 255, 0.95); }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border-color); }
        .modal-title { font-size: 16px; font-weight: 600; }
        .modal-close { width: 30px; height: 30px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; border-radius: 6px; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: var(--bg-card); }
        .modal-body { padding: 20px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border-color); }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        .form-input, .form-select { width: 100%; padding: 12px 14px; font-size: 14px; font-family: inherit; background: var(--select-bg); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--select-text); outline: none; }
        .form-input:focus, .form-select:focus { border-color: var(--accent); }
        .form-select option { background: var(--select-bg); color: var(--select-text); }
        
        .color-options { display: flex; gap: 8px; flex-wrap: wrap; }
        .color-option { width: 32px; height: 32px; border-radius: 8px; border: 3px solid transparent; cursor: pointer; transition: var(--transition); }
        .color-option:hover { transform: scale(1.1); }
        .color-option.selected { border-color: white; }
        .light-theme .color-option.selected { border-color: #333; }

        .toggle { width: 44px; height: 24px; background: var(--bg-card); border-radius: 12px; cursor: pointer; position: relative; transition: var(--transition); }
        .toggle.active { background: var(--accent); }
        .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: var(--transition); }
        .toggle.active::after { left: 22px; }

        .slider { width: 100%; height: 4px; -webkit-appearance: none; background: var(--bg-card); border-radius: 2px; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--accent); border-radius: 50%; cursor: pointer; }

        .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .setting-row:last-child { border-bottom: none; }
        .settings-section { margin-bottom: 20px; }
        .settings-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px; }

        .file-upload { border: 2px dashed var(--border-color); border-radius: var(--radius-sm); padding: 20px; text-align: center; cursor: pointer; position: relative; }
        .file-upload:hover { border-color: var(--accent); }
        .file-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        .icon-preview-section { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; background: var(--bg-card); border-radius: var(--radius-sm); margin-bottom: 16px; }
        .icon-preview { width: 64px; height: 64px; border-radius: var(--radius-sm); background: white; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
        .icon-preview img { width: 100%; height: 100%; object-fit: cover; }
        .icon-preview.placeholder { font-size: 24px; font-weight: 600; color: white; }
        .icon-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

        .gradient-preview { width: 100%; height: 60px; border-radius: var(--radius-sm); margin-bottom: 12px; border: 1px solid var(--border-color); }
        .gradient-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
        .gradient-preset { height: 40px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: var(--transition); }
        .gradient-preset:hover { transform: scale(1.05); }
        .gradient-preset.selected { border-color: white; }
        .light-theme .gradient-preset.selected { border-color: #333; }

        .context-menu { position: fixed; background: rgba(25, 25, 25, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: var(--radius-sm); min-width: 180px; padding: 6px 0; z-index: 2000; display: none; }
        .light-theme .context-menu { background: rgba(255, 255, 255, 0.95); }
        .context-menu.show { display: block; }
        .context-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 13px; cursor: pointer; transition: var(--transition); }
        .context-item:hover { background: var(--bg-card); }
        .context-item.danger { color: #ef4444; }
        .context-item svg { width: 16px; height: 16px; opacity: 0.7; }
        .context-divider { height: 1px; background: var(--border-color); margin: 6px 0; }

        .toast-container { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 3000; }
        .toast { background: rgba(25, 25, 25, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 20px; font-size: 14px; color: var(--text-primary); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }

        @media (max-width: 768px) {
            .container { padding: 16px; }
            .header { padding: 20px 0 16px; }
            .icons-grid { grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 4px; }
            .icon-item { padding: 10px 6px; }
            .icon-img-wrap { width: 46px; height: 46px; }
            .icon-label { font-size: 10px; }
            .fab { bottom: 70px; right: 16px; width: 48px; height: 48px; }
            .settings-btn { bottom: 16px; right: 16px; width: 40px; height: 40px; }
            .tab-nav-scroll-btn { width: 28px; height: 28px; }
            .tab-nav-scroll-btn.left { left: 4px; }
            .tab-nav-scroll-btn.right { right: 4px; }
        }
        @media (max-width: 400px) {
            .icons-grid { grid-template-columns: repeat(5, 1fr); }
            .icon-img-wrap { width: 42px; height: 42px; }
            .tab-btn { padding: 8px 12px; font-size: 12px; }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="wallpaper" id="wallpaper"></div>
    <div class="container">
        <!-- Widget System -->
        <div class="widgets-container" id="widgetsContainer">
            <div class="widget widget-clock" id="widgetClock">
                <div class="widget-gear" onclick="openWidgetSettings('clock')" title="Clock Settings">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                </div>
                <div class="widget-clock-time" id="clockTime">12:00</div>
                <div class="widget-clock-date" id="clockDate">Friday, January 16</div>
                <div class="widget-clock-greeting" id="clockGreeting"></div>
            </div>
            <div class="widget widget-calendar" id="widgetCalendar">
                <div class="widget-gear" onclick="openWidgetSettings('calendar')" title="Calendar Settings">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                </div>
                <div class="widget-calendar-header" id="calendarHeader">Jan 2026</div>
                <div class="widget-calendar-grid" id="calendarGrid"></div>
            </div>
            <div class="widget widget-weather" id="widgetWeather">
                <div class="widget-gear" onclick="openWidgetSettings('weather')" title="Weather Settings">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                </div>
                <div id="weatherContent">
                    <div class="widget-weather-main">
                        <span class="widget-weather-icon">☀️</span>
                        <span class="widget-weather-temp">--</span>
                        <span class="widget-weather-unit">°F</span>
                    </div>
                    <div class="widget-weather-desc">Loading...</div>
                </div>
            </div>
            <div class="widget widget-finance" id="widgetFinance">
                <div class="widget-gear" onclick="openWidgetSettings('finance')" title="Finance Settings">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                </div>
                <div id="financeContent">
                    <div class="widget-finance-symbol">SPY</div>
                    <div class="widget-finance-price">--</div>
                    <div class="widget-finance-change">Loading...</div>
                </div>
            </div>
        </div>
        
        <div class="search-container" id="searchContainer">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Search Brave..." autocomplete="off">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <span class="search-hint">/</span>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>
        <div class="favorites-section" id="favoritesSection"></div>
        <div class="tab-nav-wrapper">
            <button class="tab-nav-scroll-btn left" id="tabScrollLeft" onclick="scrollTabs(-1)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <nav class="tab-nav" id="tabNav"></nav>
            <button class="tab-nav-scroll-btn right" id="tabScrollRight" onclick="scrollTabs(1)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>

        <div id="content"></div>
    </div>
    <button class="fab" id="fabBtn" title="Add Link">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="settings-btn" id="settingsBtn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
    </button>
    <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>
    <div class="context-menu" id="contextMenu"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
    let appData = { 
        settings: { 
            name: '', 
            showGreeting: true, 
            showTime: true, 
            showSearch: true, 
            searchEngine: 'brave', 
            theme: 'dark', 
            clockFormat: '24', 
            wallpaper: { type: 'none', blur: 0, dim: 30 },
            widgets: {
                clock: { visible: true, format: '12', showSeconds: false, showDate: true, showGreeting: true },
                calendar: { visible: true, startMonday: false },
                weather: { visible: true, lat: '38.98', lon: '-94.67', unit: 'F', label: '' },
                finance: { visible: true, symbol: 'SPY', refreshInterval: 5 }
            }
        }, 
        categories: [], 
        favorites: [] 
    };
    let activeTab = null, activeSubfolder = null, dragState = null, folderCreateTimer = null;
    let weatherTimer = null, financeTimer = null;

    const COLORS = ['#22c55e','#6366f1','#f59e0b','#ef4444','#f97316','#14b8a6','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
    const ENGINES = { brave: 'https://search.brave.com/search?q=', google: 'https://www.google.com/search?q=', duckduckgo: 'https://duckduckgo.com/?q=', bing: 'https://www.bing.com/search?q=', startpage: 'https://www.startpage.com/sp/search?query=' };
    const GRADIENT_PRESETS = [
        { name: 'Sunset', value: 'linear-gradient(135deg, #ff6b6b 0%, #feca57 100%)' },
        { name: 'Ocean', value: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' },
        { name: 'Forest', value: 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)' },
        { name: 'Night', value: 'linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%)' },
        { name: 'Aurora', value: 'linear-gradient(135deg, #00c6ff 0%, #0072ff 100%)' },
        { name: 'Peach', value: 'linear-gradient(135deg, #ee9ca7 0%, #ffdde1 100%)' },
        { name: 'Deep', value: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)' },
        { name: 'Warm', value: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)' },
        { name: 'Cool', value: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)' },
        { name: 'Earth', value: 'linear-gradient(135deg, #8B4513 0%, #DAA520 100%)' },
        { name: 'Midnight', value: 'linear-gradient(135deg, #232526 0%, #414345 100%)' },
        { name: 'Rose', value: 'linear-gradient(135deg, #f5af19 0%, #f12711 100%)' }
    ];

    const $ = id => document.getElementById(id);
    const esc = t => { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; };
    function stringToColor(str) { let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash); return `hsl(${Math.abs(hash) % 360}, 55%, 50%)`; }
    function getFavicon(url) { try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=128`; } catch { return null; } }
    function getDomain(url) { try { return new URL(url).hostname.replace('www.', ''); } catch { return url; } }
    function generateId(prefix) { return `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`; }

    function updateTabScrollButtons() {
        const nav = $('tabNav'), leftBtn = $('tabScrollLeft'), rightBtn = $('tabScrollRight');
        if (!nav || !leftBtn || !rightBtn) return;
        leftBtn.classList.toggle('visible', nav.scrollLeft > 0);
        rightBtn.classList.toggle('visible', nav.scrollLeft < nav.scrollWidth - nav.clientWidth - 1);
    }
    window.scrollTabs = function(direction) { const nav = $('tabNav'); if (nav) { nav.scrollBy({ left: direction * 200, behavior: 'smooth' }); setTimeout(updateTabScrollButtons, 300); } };
    
    let tabTouchStart = null, tabScrollStart = null;
    function setupTabTouchScroll() {
        const nav = $('tabNav'); if (!nav) return;
        nav.addEventListener('touchstart', e => { tabTouchStart = e.touches[0].clientX; tabScrollStart = nav.scrollLeft; }, { passive: true });
        nav.addEventListener('touchmove', e => { if (tabTouchStart !== null) nav.scrollLeft = tabScrollStart + (tabTouchStart - e.touches[0].clientX); }, { passive: true });
        nav.addEventListener('touchend', () => { tabTouchStart = null; tabScrollStart = null; updateTabScrollButtons(); });
        nav.addEventListener('scroll', updateTabScrollButtons);
    }

    async function loadWallpaper() {
        const wp = appData.settings?.wallpaper || { type: 'none' }, el = $('wallpaper');
        document.documentElement.style.setProperty('--wallpaper-blur', (wp.blur || 0) + 'px');
        document.documentElement.style.setProperty('--wallpaper-dim', (wp.dim || 30) / 100);
        if (wp.type === 'none') { el.style.backgroundImage = 'none'; el.style.background = 'none'; return; }
        if (wp.type === 'solid') { el.style.backgroundImage = 'none'; el.style.background = wp.color || '#1a1a2e'; return; }
        if (wp.type === 'gradient') { el.style.backgroundImage = 'none'; el.style.background = wp.gradient || GRADIENT_PRESETS[0].value; return; }
        if (wp.type === 'custom' && wp.url) { el.style.background = 'none'; el.style.backgroundImage = `url(${wp.url})`; return; }
        try {
            let imgUrl = '';
            if (wp.type === 'bing') { 
                const res = await fetch('/api/wallpaper/bing'); 
                const data = await res.json(); 
                imgUrl = data.url; 
            }
            else if (wp.type === 'nasa') { 
                const res = await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY'); 
                const data = await res.json(); 
                if (data.media_type === 'image') imgUrl = data.hdurl || data.url; 
            }
            else if (wp.type === 'unsplash') { 
                const res = await fetch('/api/wallpaper/picsum?category=' + encodeURIComponent(wp.unsplashCategory || 'nature')); 
                const data = await res.json(); 
                imgUrl = data.url; 
            }
            if (imgUrl) { el.style.background = 'none'; el.style.backgroundImage = `url(${imgUrl})`; }
        } catch (e) { console.error('Wallpaper error:', e); }
    }

    // ===================== WIDGET SYSTEM =====================
    
    function getWidgetSettings() {
        const defaults = {
            clock: { visible: true, format: '12', showSeconds: false, showDate: true, showGreeting: true },
            calendar: { visible: true, startMonday: false },
            weather: { visible: true, lat: '38.98', lon: '-94.67', unit: 'F', label: '' },
            finance: { visible: true, symbol: 'SPY', refreshInterval: 5 }
        };
        const w = appData.settings?.widgets || {};
        return {
            clock: { ...defaults.clock, ...w.clock },
            calendar: { ...defaults.calendar, ...w.calendar },
            weather: { ...defaults.weather, ...w.weather },
            finance: { ...defaults.finance, ...w.finance }
        };
    }
    
    function updateWidgetVisibility() {
        const w = getWidgetSettings();
        $('widgetClock').style.display = w.clock.visible ? '' : 'none';
        $('widgetCalendar').style.display = w.calendar.visible ? '' : 'none';
        $('widgetWeather').style.display = w.weather.visible ? '' : 'none';
        $('widgetFinance').style.display = w.finance.visible ? '' : 'none';
        $('searchContainer').classList.toggle('hidden', !appData.settings?.showSearch);
        $('searchInput').placeholder = 'Search ' + ((appData.settings?.searchEngine || 'brave').charAt(0).toUpperCase() + (appData.settings?.searchEngine || 'brave').slice(1)) + '...';
    }

    function updateClockWidget() {
        const now = new Date();
        const w = getWidgetSettings().clock;
        if (!w.visible) return;
        
        var hours = now.getHours();
        var minutes = String(now.getMinutes()).padStart(2, '0');
        var timeHtml = '';
        
        if (w.format === '12') {
            var ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            timeHtml = hours + ':' + minutes;
            if (w.showSeconds) {
                timeHtml += '<span class="widget-clock-seconds">' + String(now.getSeconds()).padStart(2, '0') + '</span>';
            }
            timeHtml += '<span class="widget-clock-ampm">' + ampm + '</span>';
        } else {
            timeHtml = String(hours).padStart(2, '0') + ':' + minutes;
            if (w.showSeconds) {
                timeHtml += '<span class="widget-clock-seconds">' + String(now.getSeconds()).padStart(2, '0') + '</span>';
            }
        }
        
        $('clockTime').innerHTML = timeHtml;
        
        if (w.showDate) {
            $('clockDate').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            $('clockDate').style.display = '';
        } else {
            $('clockDate').style.display = 'none';
        }
        
        if (w.showGreeting) {
            var hour = now.getHours();
            var greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
            if (appData.settings?.name) greeting += ', ' + appData.settings.name;
            $('clockGreeting').textContent = greeting;
            $('clockGreeting').style.display = '';
        } else {
            $('clockGreeting').style.display = 'none';
        }
    }

    function updateCalendarWidget() {
        const w = getWidgetSettings().calendar;
        if (!w.visible) return;
        
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const today = now.getDate();
        
        $('calendarHeader').textContent = now.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        
        var firstDay = new Date(year, month, 1).getDay();
        var daysInMonth = new Date(year, month + 1, 0).getDate();
        var daysInPrevMonth = new Date(year, month, 0).getDate();
        
        if (w.startMonday) {
            firstDay = (firstDay + 6) % 7;
        }
        
        var html = '';
        var dayNames = w.startMonday ? ['M','T','W','T','F','S','S'] : ['S','M','T','W','T','F','S'];
        dayNames.forEach(function(d) { html += '<div class="widget-calendar-day-header">' + d + '</div>'; });
        
        // Previous month days
        for (var i = firstDay - 1; i >= 0; i--) {
            html += '<div class="widget-calendar-day other-month">' + (daysInPrevMonth - i) + '</div>';
        }
        
        // Current month days
        for (var d = 1; d <= daysInMonth; d++) {
            if (d === today) {
                html += '<div class="widget-calendar-day today">' + d + '</div>';
            } else {
                html += '<div class="widget-calendar-day">' + d + '</div>';
            }
        }
        
        // Fill remaining cells
        var totalCells = firstDay + daysInMonth;
        var remainingCells = totalCells <= 35 ? 35 - totalCells : 42 - totalCells;
        for (var n = 1; n <= remainingCells; n++) {
            html += '<div class="widget-calendar-day other-month">' + n + '</div>';
        }
        
        $('calendarGrid').innerHTML = html;
    }

    async function updateWeatherWidget() {
        const w = getWidgetSettings().weather;
        if (!w.visible) return;
        
        try {
            var url = '/api/weather?lat=' + encodeURIComponent(w.lat) + '&lon=' + encodeURIComponent(w.lon) + '&unit=' + w.unit;
            const res = await fetch(url);
            const data = await res.json();
            
            if (data.error) {
                $('weatherContent').innerHTML = '<div class="widget-weather-error">Weather unavailable</div>';
                return;
            }
            
            var html = '<div class="widget-weather-main">';
            html += '<span class="widget-weather-icon">' + data.icon + '</span>';
            html += '<span class="widget-weather-temp">' + Math.round(data.temp) + '</span>';
            html += '<span class="widget-weather-unit">' + data.unit + '</span>';
            html += '</div>';
            html += '<div class="widget-weather-desc">' + data.description + '</div>';
            if (w.label) {
                html += '<div class="widget-weather-location">' + esc(w.label) + '</div>';
            }
            
            $('weatherContent').innerHTML = html;
        } catch (e) {
            console.error('Weather error:', e);
            $('weatherContent').innerHTML = '<div class="widget-weather-error">Weather unavailable</div>';
        }
    }

    async function updateFinanceWidget() {
        const w = getWidgetSettings().finance;
        if (!w.visible) return;
        
        try {
            const res = await fetch('/api/finance?symbol=' + encodeURIComponent(w.symbol));
            const data = await res.json();
            
            if (data.error && !data.price) {
                $('financeContent').innerHTML = '<div class="widget-finance-error">' + esc(data.error) + '</div>';
                return;
            }
            
            var changeClass = data.change >= 0 ? 'positive' : 'negative';
            var changeSign = data.change >= 0 ? '+' : '';
            
            var html = '<div class="widget-finance-symbol">' + esc(data.symbol) + '</div>';
            html += '<div class="widget-finance-price">$' + data.price.toFixed(2) + '</div>';
            html += '<div class="widget-finance-change ' + changeClass + '">' + changeSign + data.change.toFixed(2) + ' (' + changeSign + data.changePercent.toFixed(2) + '%)</div>';
            if (data.name && data.name !== data.symbol) {
                html += '<div class="widget-finance-name">' + esc(data.name) + '</div>';
            }
            if (!data.isMarketOpen) {
                html += '<div class="widget-finance-market">Market Closed</div>';
            }
            
            $('financeContent').innerHTML = html;
        } catch (e) {
            console.error('Finance error:', e);
            $('financeContent').innerHTML = '<div class="widget-finance-error">Data unavailable</div>';
        }
    }

    function startWidgetTimers() {
        // Clear existing timers
        if (weatherTimer) clearInterval(weatherTimer);
        if (financeTimer) clearInterval(financeTimer);
        
        const w = getWidgetSettings();
        
        // Weather updates every 10 minutes
        if (w.weather.visible) {
            updateWeatherWidget();
            weatherTimer = setInterval(updateWeatherWidget, 10 * 60 * 1000);
        }
        
        // Finance updates based on setting (default 5 min)
        if (w.finance.visible) {
            updateFinanceWidget();
            var interval = (w.finance.refreshInterval || 5) * 60 * 1000;
            financeTimer = setInterval(updateFinanceWidget, interval);
        }
    }

    window.openWidgetSettings = function(widget) {
        const w = getWidgetSettings();
        var h = '<div class="modal-header"><h3 class="modal-title">';
        
        if (widget === 'clock') {
            h += 'Clock Settings</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
            h += '<div class="modal-body">';
            h += '<div class="setting-row"><span>12-Hour Format</span><div class="toggle' + (w.clock.format === '12' ? ' active' : '') + '" id="clockFormat"></div></div>';
            h += '<div class="setting-row"><span>Show Seconds</span><div class="toggle' + (w.clock.showSeconds ? ' active' : '') + '" id="clockSeconds"></div></div>';
            h += '<div class="setting-row"><span>Show Date</span><div class="toggle' + (w.clock.showDate ? ' active' : '') + '" id="clockShowDate"></div></div>';
            h += '<div class="setting-row"><span>Show Greeting</span><div class="toggle' + (w.clock.showGreeting ? ' active' : '') + '" id="clockShowGreeting"></div></div>';
            h += '</div>';
            h += '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveWidgetBtn">Save</button></div>';
            openModal(h);
            ['clockFormat', 'clockSeconds', 'clockShowDate', 'clockShowGreeting'].forEach(function(id) { $(id).onclick = function() { $(id).classList.toggle('active'); }; });
            $('saveWidgetBtn').onclick = async function() {
                if (!appData.settings.widgets) appData.settings.widgets = {};
                appData.settings.widgets.clock = {
                    visible: w.clock.visible,
                    format: $('clockFormat').classList.contains('active') ? '12' : '24',
                    showSeconds: $('clockSeconds').classList.contains('active'),
                    showDate: $('clockShowDate').classList.contains('active'),
                    showGreeting: $('clockShowGreeting').classList.contains('active')
                };
                await saveData('Clock settings saved');
                closeModal();
                updateClockWidget();
            };
        }
        else if (widget === 'calendar') {
            h += 'Calendar Settings</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
            h += '<div class="modal-body">';
            h += '<div class="setting-row"><span>Start Week on Monday</span><div class="toggle' + (w.calendar.startMonday ? ' active' : '') + '" id="calStartMonday"></div></div>';
            h += '</div>';
            h += '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveWidgetBtn">Save</button></div>';
            openModal(h);
            $('calStartMonday').onclick = function() { $('calStartMonday').classList.toggle('active'); };
            $('saveWidgetBtn').onclick = async function() {
                if (!appData.settings.widgets) appData.settings.widgets = {};
                appData.settings.widgets.calendar = {
                    visible: w.calendar.visible,
                    startMonday: $('calStartMonday').classList.contains('active')
                };
                await saveData('Calendar settings saved');
                closeModal();
                updateCalendarWidget();
            };
        }
        else if (widget === 'weather') {
            h += 'Weather Settings</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
            h += '<div class="modal-body">';
            h += '<div class="form-group"><label class="form-label">Location Label</label><input type="text" class="form-input" id="weatherLabel" value="' + esc(w.weather.label || '') + '" placeholder="e.g., Home, Office"></div>';

    async function loadData() {
        try { 
            const r = await fetch('/api/data'); 
            appData = await r.json(); 
            if (!appData.categories) appData.categories = []; 
            if (!appData.favorites) appData.favorites = []; 
            if (!appData.settings) appData.settings = {}; 
            if (!appData.settings.clockFormat) appData.settings.clockFormat = '24'; 
            if (!appData.settings.wallpaper) appData.settings.wallpaper = { type: 'none', blur: 0, dim: 30 }; 
            if (!appData.settings.widgets) appData.settings.widgets = {};
            if (appData.categories.length && !activeTab) activeTab = appData.categories[0].id; 
        }
        catch (e) { console.error('Load failed:', e); }
    }

    function applyTheme() { const t = appData.settings?.theme || 'dark'; if (t === 'light') document.body.classList.add('light-theme'); else if (t === 'dark') document.body.classList.remove('light-theme'); else document.body.classList.toggle('light-theme', !matchMedia('(prefers-color-scheme:dark)').matches); }

        $('tabNav').querySelectorAll('.tab-btn[data-id]').forEach(btn => {

        folders.forEach(f => { 
            h += '<div class="subfolder-chip' + (activeSubfolder === f.id ? ' active' : '') + '" data-folder="' + f.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>' + esc(f.name) + ' <span class="subfolder-count">' + f.links.length + '</span></div>';

        h += '<div class="icons-grid" id="iconsGrid">';

    function setupIconDragDrop() {
        const grid = $('iconsGrid'); if (!grid) return;
        grid.querySelectorAll('.icon-item[data-id]').forEach(item => {
            item.ondragstart = e => { dragState = { type: 'link', linkId: item.dataset.id, sourceCatId: activeTab, sourceFolderId: activeSubfolder, sourceIdx: parseInt(item.dataset.idx) }; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', item.dataset.id); };
            item.ondragend = () => { item.classList.remove('dragging'); clearFolderCreateTimer(); document.querySelectorAll('.drag-over, .folder-drop-target').forEach(el => el.classList.remove('drag-over', 'folder-drop-target')); dragState = null; };
            item.ondragover = e => { if (!dragState || dragState.type !== 'link' || dragState.linkId === item.dataset.id) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (!item.classList.contains('folder-drop-target')) { item.classList.add('drag-over'); startFolderCreateTimer(item); } };
            item.ondragleave = e => { if (e.relatedTarget && item.contains(e.relatedTarget)) return; item.classList.remove('drag-over', 'folder-drop-target'); clearFolderCreateTimer(); };
            item.ondrop = e => { e.preventDefault(); item.classList.remove('drag-over', 'folder-drop-target'); clearFolderCreateTimer(); if (!dragState || dragState.type !== 'link') return; const targetIdx = parseInt(item.dataset.idx), sourceIdx = dragState.sourceIdx; if (dragState.sourceCatId === activeTab && dragState.sourceFolderId === activeSubfolder && sourceIdx !== targetIdx) reorderBookmark(sourceIdx, targetIdx); dragState = null; };
            item.oncontextmenu = e => { e.preventDefault(); showLinkContext(e, item.dataset.id); };
        });
    }

    function startFolderCreateTimer(targetItem) { clearFolderCreateTimer(); folderCreateTimer = setTimeout(() => { targetItem.classList.remove('drag-over'); targetItem.classList.add('folder-drop-target'); folderCreateTimer = setTimeout(() => { if (dragState && targetItem.classList.contains('folder-drop-target')) createFolderFromDrop(dragState.linkId, targetItem.dataset.id); }, 1500); }, 1000); }
    function clearFolderCreateTimer() { if (folderCreateTimer) { clearTimeout(folderCreateTimer); folderCreateTimer = null; } }

    async function createFolderFromDrop(draggedLinkId, targetLinkId) {
        const cat = appData.categories?.find(c => c.id === activeTab); if (!cat) return;
        const links = activeSubfolder ? cat.subfolders?.find(f => f.id === activeSubfolder)?.links : cat.links; if (!links) return;
        const draggedLink = links.find(l => l.id === draggedLinkId), targetLink = links.find(l => l.id === targetLinkId); if (!draggedLink || !targetLink) return;
        const newFolder = { id: generateId('folder'), name: `${targetLink.name} & ${draggedLink.name}`.substring(0, 30), links: [{ ...targetLink }, { ...draggedLink }] };
        if (!cat.subfolders) cat.subfolders = []; cat.subfolders.push(newFolder);
        if (activeSubfolder) { const folder = cat.subfolders.find(f => f.id === activeSubfolder); folder.links = folder.links.filter(l => l.id !== draggedLinkId && l.id !== targetLinkId); }
        else { cat.links = cat.links.filter(l => l.id !== draggedLinkId && l.id !== targetLinkId); }
        await saveData('Folder created'); dragState = null; render();
    }

    async function reorderBookmark(fromIdx, toIdx) {
        const cat = appData.categories?.find(c => c.id === activeTab); if (!cat) return;
        const links = activeSubfolder ? cat.subfolders?.find(f => f.id === activeSubfolder)?.links : cat.links; if (!links || fromIdx === toIdx) return;
        const [moved] = links.splice(fromIdx, 1); links.splice(toIdx, 0, moved); await saveData(); renderContent();
    }

    async function moveBookmarkToTab(linkId, sourceCatId, sourceFolderId, targetCatId) {
        if (sourceCatId === targetCatId && !sourceFolderId) return;
        const sourceCat = appData.categories?.find(c => c.id === sourceCatId), targetCat = appData.categories?.find(c => c.id === targetCatId); if (!sourceCat || !targetCat) return;
        let link = null;
        if (sourceFolderId) { const folder = sourceCat.subfolders?.find(f => f.id === sourceFolderId); if (folder) { const idx = folder.links.findIndex(l => l.id === linkId); if (idx >= 0) link = folder.links.splice(idx, 1)[0]; } }
        else { const idx = sourceCat.links.findIndex(l => l.id === linkId); if (idx >= 0) link = sourceCat.links.splice(idx, 1)[0]; }
        if (!link) return; if (!targetCat.links) targetCat.links = []; targetCat.links.push(link); await saveData('Bookmark moved'); render();
    }

    function showContext(x, y, items) {
        const menu = $('contextMenu'); menu.innerHTML = items.map((it, i) => it.divider ? '<div class="context-divider"></div>' : `<div class="context-item${it.danger ? ' danger' : ''}" data-idx="${i}">${it.icon || ''}${it.label}</div>`).join('');
        menu.classList.add('show'); menu.style.left = Math.min(x, innerWidth - 200) + 'px'; menu.style.top = Math.min(y, innerHeight - menu.offsetHeight - 10) + 'px';
        menu.querySelectorAll('.context-item').forEach(el => { el.onclick = () => { menu.classList.remove('show'); items[+el.dataset.idx]?.action?.(); }; });
    }
    document.addEventListener('click', () => $('contextMenu').classList.remove('show'));

    function showTabContext(e, tabId) { showContext(e.clientX, e.clientY, [{ label: 'Edit Tab', action: () => openCategoryModal(appData.categories.find(c => c.id === tabId)) }, { label: 'Add Link', action: () => { activeTab = tabId; activeSubfolder = null; render(); openLinkModal(tabId, null); } }, { label: 'Add Folder', action: () => openFolderModal(tabId) }, { divider: true }, { label: 'Delete Tab', action: () => deleteCategory(tabId), danger: true }]); }
    function showFolderContext(e, folderId) { showContext(e.clientX, e.clientY, [{ label: 'Edit Folder', action: () => { const cat = appData.categories.find(c => c.id === activeTab); openFolderModal(activeTab, cat?.subfolders?.find(f => f.id === folderId)); } }, { label: 'Add Link', action: () => openLinkModal(activeTab, folderId) }, { divider: true }, { label: 'Delete Folder', action: () => deleteFolder(activeTab, folderId), danger: true }]); }
    function showLinkContext(e, linkId) { const cat = appData.categories.find(c => c.id === activeTab), links = activeSubfolder ? cat?.subfolders?.find(f => f.id === activeSubfolder)?.links : cat?.links, link = links?.find(l => l.id === linkId); if (!link) return; const isFav = appData.favorites?.some(f => f.id === linkId); showContext(e.clientX, e.clientY, [{ label: 'Open', action: () => window.open(link.url, '_blank') }, { label: 'Copy URL', action: () => { navigator.clipboard.writeText(link.url); toast('Copied!'); } }, { divider: true }, { label: isFav ? 'Remove from Favorites' : 'Add to Favorites', action: () => toggleFavorite(linkId) }, { label: 'Edit', action: () => openLinkModal(activeTab, activeSubfolder, linkId) }, { divider: true }, { label: 'Delete', action: () => deleteLink(activeTab, activeSubfolder, linkId), danger: true }]); }
    function showFavoriteContext(e, favId) { showContext(e.clientX, e.clientY, [{ label: 'Open', action: () => { const f = appData.favorites.find(x => x.id === favId); if (f) window.open(f.url, '_blank'); } }, { label: 'Remove from Favorites', action: () => { appData.favorites = appData.favorites.filter(f => f.id !== favId); saveData('Removed'); render(); } }]); }

    function toggleFavorite(linkId) {
        const cat = appData.categories.find(c => c.id === activeTab), links = activeSubfolder ? cat?.subfolders?.find(f => f.id === activeSubfolder)?.links : cat?.links, link = links?.find(l => l.id === linkId); if (!link) return;
        const idx = appData.favorites.findIndex(f => f.id === linkId); if (idx >= 0) { appData.favorites.splice(idx, 1); toast('Removed from favorites'); } else { appData.favorites.push({ ...link }); toast('Added to favorites'); }
        saveData(); render();
    }

    function openModal(html) { $('modal').innerHTML = html; $('modalOverlay').classList.add('active'); }
    function closeModal() { $('modalOverlay').classList.remove('active'); }

    window.openLinkModal = function(catId, folderId, linkId) {
        const cat = appData.categories?.find(c => c.id === catId);
        let link = null; if (linkId) { const links = folderId ? cat?.subfolders?.find(f => f.id === folderId)?.links : cat?.links; link = links?.find(l => l.id === linkId); }
        const isEdit = !!link, customIcon = link?.customIcon || '', faviconUrl = link?.url ? getFavicon(link.url) : '', currentIcon = customIcon || faviconUrl, bg = link?.url ? stringToColor(link.url) : '#666', initial = link?.name ? link.name[0].toUpperCase() : '?';
        let h = `<div class="modal-header"><h3 class="modal-title">${isEdit ? 'Edit' : 'Add'} Link</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body">`;
        if (isEdit) { h += `<div class="icon-preview-section"><div class="icon-preview${currentIcon ? '' : ' placeholder'}" id="iconPreview" style="${currentIcon ? '' : 'background:' + bg}">${currentIcon ? `<img src="${currentIcon}" id="iconPreviewImg">` : initial}</div><div class="icon-actions"><button class="btn btn-secondary btn-small" onclick="refreshFavicon()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg> Refresh</button><label class="btn btn-secondary btn-small" style="cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg> Upload<input type="file" id="customIconInput" accept="image/*" style="display:none" onchange="handleIconUpload(event)"></label>${customIcon ? '<button class="btn btn-secondary btn-small" onclick="clearCustomIcon()">Use Favicon</button>' : ''}</div></div>`; }
        h += `<div class="form-group"><label class="form-label">URL</label><input type="url" class="form-input" id="linkUrl" value="${esc(link?.url || '')}" placeholder="https://example.com"></div><div class="form-group"><label class="form-label">Name</label><input type="text" class="form-input" id="linkName" value="${esc(link?.name || '')}" placeholder="Site name (auto-fills)"></div></div>`;
        h += `<div class="modal-footer">${isEdit ? `<button class="btn btn-danger" style="margin-right:auto" onclick="deleteLink('${catId}',${folderId ? "'" + folderId + "'" : 'null'},'${linkId}');closeModal()">Delete</button>` : ''}<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveLink">${isEdit ? 'Save' : 'Add'}</button></div>`;
        openModal(h);
        window._currentEditLink = link; window._currentEditCatId = catId; window._currentEditFolderId = folderId;
        $('linkUrl').onblur = () => { if (!$('linkName').value && $('linkUrl').value) { try { $('linkName').value = getDomain($('linkUrl').value); } catch {} } };
        $('saveLink').onclick = async () => { let url = $('linkUrl').value.trim(); if (!url) return; if (!url.startsWith('http')) url = 'https://' + url; const name = $('linkName').value.trim() || getDomain(url); const cat = appData.categories.find(c => c.id === catId); if (isEdit) { link.url = url; link.name = name; } else { const newLink = { id: generateId('link'), name, url }; if (folderId) { const folder = cat.subfolders.find(f => f.id === folderId); folder.links.push(newLink); } else { if (!cat.links) cat.links = []; cat.links.push(newLink); } } await saveData(isEdit ? 'Link updated' : 'Link added'); closeModal(); renderContent(); };
        $('linkUrl').focus();
    };

    window.refreshFavicon = function() { const link = window._currentEditLink; if (!link) return; delete link.customIcon; const preview = $('iconPreview'), url = $('linkUrl').value || link.url, favicon = getFavicon(url); if (favicon) { preview.innerHTML = `<img src="${favicon}?t=${Date.now()}">`; preview.classList.remove('placeholder'); preview.style.background = ''; } saveData('Favicon refreshed'); renderContent(); };
    window.handleIconUpload = function(e) { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(evt) { const base64 = evt.target.result, link = window._currentEditLink; if (link) { link.customIcon = base64; const preview = $('iconPreview'); preview.innerHTML = `<img src="${base64}">`; preview.classList.remove('placeholder'); preview.style.background = ''; const fav = appData.favorites.find(f => f.id === link.id); if (fav) fav.customIcon = base64; saveData('Custom icon set'); renderContent(); } }; reader.readAsDataURL(file); };
    window.clearCustomIcon = function() { const link = window._currentEditLink; if (!link) return; delete link.customIcon; const fav = appData.favorites.find(f => f.id === link.id); if (fav) delete fav.customIcon; openLinkModal(window._currentEditCatId, window._currentEditFolderId, link.id); saveData(); renderContent(); };
    window.deleteLink = async function(catId, folderId, linkId) { const cat = appData.categories.find(c => c.id === catId); if (folderId) { const folder = cat.subfolders.find(f => f.id === folderId); folder.links = folder.links.filter(l => l.id !== linkId); } else { cat.links = cat.links.filter(l => l.id !== linkId); } appData.favorites = appData.favorites.filter(f => f.id !== linkId); await saveData('Link deleted'); renderContent(); };

    function openSettings() {
        const wp = appData.settings?.wallpaper || { type: 'none', blur: 0, dim: 30 };
        const w = getWidgetSettings();
        let h = '<div class="modal-header"><h3 class="modal-title">Settings</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
        h += '<div class="modal-body">';
        h += '<div class="settings-section"><div class="settings-title">Display</div>';
        h += '<div class="form-group"><label class="form-label">Your Name</label><input type="text" class="form-input" id="setName" value="' + esc(appData.settings?.name || '') + '" placeholder="For greeting"></div>';
        h += '<div class="setting-row"><span>Show Search</span><div class="toggle' + (appData.settings?.showSearch !== false ? ' active' : '') + '" id="togSearch"></div></div>';
        h += '</div>';
        h += '<div class="settings-section"><div class="settings-title">Widgets</div>';
        h += '<p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Click the gear icon on each widget to configure it</p>';
        h += '<div class="setting-row"><span>🕐 Clock Widget</span><div class="toggle' + (w.clock.visible ? ' active' : '') + '" id="togClock"></div></div>';
        h += '<div class="setting-row"><span>📅 Calendar Widget</span><div class="toggle' + (w.calendar.visible ? ' active' : '') + '" id="togCalendar"></div></div>';
        h += '<div class="setting-row"><span>🌤️ Weather Widget</span><div class="toggle' + (w.weather.visible ? ' active' : '') + '" id="togWeather"></div></div>';
        h += '<div class="setting-row"><span>📈 Finance Widget</span><div class="toggle' + (w.finance.visible ? ' active' : '') + '" id="togFinance"></div></div>';
        h += '</div>';
        h += '<div class="settings-section"><div class="settings-title">Theme</div>';
        h += '<div class="form-group"><select class="form-select" id="setTheme"><option value="dark"' + (appData.settings?.theme === 'dark' ? ' selected' : '') + '>Dark</option><option value="light"' + (appData.settings?.theme === 'light' ? ' selected' : '') + '>Light</option><option value="auto"' + (appData.settings?.theme === 'auto' ? ' selected' : '') + '>Auto</option></select></div>';
        h += '</div>';
        h += '<div class="settings-section"><div class="settings-title">Wallpaper</div>';
        h += '<div class="form-group"><select class="form-select" id="wpType"><option value="none"' + (wp.type === 'none' ? ' selected' : '') + '>None</option><option value="bing"' + (wp.type === 'bing' ? ' selected' : '') + '>Bing Daily</option><option value="nasa"' + (wp.type === 'nasa' ? ' selected' : '') + '>NASA APOD</option><option value="unsplash"' + (wp.type === 'unsplash' ? ' selected' : '') + '>Random Photos</option><option value="custom"' + (wp.type === 'custom' ? ' selected' : '') + '>Custom URL</option><option value="solid"' + (wp.type === 'solid' ? ' selected' : '') + '>Solid Color</option><option value="gradient"' + (wp.type === 'gradient' ? ' selected' : '') + '>Gradient</option></select></div>';
        h += '<div id="wpCustom" class="form-group" style="display:' + (wp.type === 'custom' ? 'block' : 'none') + '"><input type="url" class="form-input" id="wpUrl" value="' + esc(wp.url || '') + '" placeholder="Image URL"></div>';
        h += '<div id="wpUnsplash" class="form-group" style="display:' + (wp.type === 'unsplash' ? 'block' : 'none') + '"><select class="form-select" id="wpCategory">';
        ['nature','architecture','minimal','space','abstract','dark','mountains','ocean'].forEach(function(c) { h += '<option value="' + c + '"' + (wp.unsplashCategory === c ? ' selected' : '') + '>' + c + '</option>'; });
        h += '</select></div>';
        h += '<div id="wpSolid" class="form-group" style="display:' + (wp.type === 'solid' ? 'block' : 'none') + '"><input type="color" class="form-input" id="wpColor" value="' + (wp.color || '#1a1a2e') + '" style="height:44px"></div>';
        h += '<div id="wpGradient" class="form-group" style="display:' + (wp.type === 'gradient' ? 'block' : 'none') + '"><div class="gradient-preview" id="gradientPreview" style="background:' + (wp.gradient || GRADIENT_PRESETS[0].value) + ';height:60px;border-radius:8px;margin-bottom:10px"></div><div class="gradient-presets" id="gradientPresets" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"></div><input type="text" class="form-input" id="wpGradientCustom" value="' + esc(wp.gradient || '') + '" placeholder="Custom CSS gradient"></div>';
        h += '<div class="form-group"><label class="form-label">Blur: <span id="blurVal">' + (wp.blur || 0) + 'px</span></label><input type="range" class="slider" id="wpBlur" min="0" max="30" value="' + (wp.blur || 0) + '"></div>';
        h += '<div class="form-group"><label class="form-label">Dim: <span id="dimVal">' + (wp.dim || 30) + '%</span></label><input type="range" class="slider" id="wpDim" min="0" max="70" value="' + (wp.dim || 30) + '"></div>';
        h += '</div>';
        h += '<div class="settings-section"><div class="settings-title">Search Engine</div>';
        h += '<div class="form-group"><select class="form-select" id="setEngine"><option value="brave"' + (appData.settings?.searchEngine === 'brave' ? ' selected' : '') + '>Brave</option><option value="google"' + (appData.settings?.searchEngine === 'google' ? ' selected' : '') + '>Google</option><option value="duckduckgo"' + (appData.settings?.searchEngine === 'duckduckgo' ? ' selected' : '') + '>DuckDuckGo</option><option value="bing"' + (appData.settings?.searchEngine === 'bing' ? ' selected' : '') + '>Bing</option><option value="startpage"' + (appData.settings?.searchEngine === 'startpage' ? ' selected' : '') + '>Startpage</option></select></div>';
        h += '</div>';
        h += '<div class="settings-section"><div class="settings-title">Data</div>';
        h += '<div class="form-group"><label class="form-label">Import Bonjour Backup</label><div class="file-upload"><input type="file" id="impBonjour" accept=".json"><div style="color:var(--text-muted)">Drop JSON or click</div></div></div>';
        h += '<div class="form-group"><label class="form-label">Import Browser Bookmarks</label><div class="file-upload"><input type="file" id="impBrowser" accept=".html"><div style="color:var(--text-muted)">Drop HTML or click</div></div></div>';
        h += '<button class="btn btn-secondary" onclick="exportData()" style="width:100%">Export Data</button>';
        h += '</div></div>';
        h += '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveSettings">Save</button></div>';
        openModal(h);
        ['togSearch', 'togClock', 'togCalendar', 'togWeather', 'togFinance'].forEach(function(id) { $(id).onclick = function() { $(id).classList.toggle('active'); }; });
        $('wpType').onchange = function() { var t = $('wpType').value; $('wpCustom').style.display = t === 'custom' ? 'block' : 'none'; $('wpUnsplash').style.display = t === 'unsplash' ? 'block' : 'none'; $('wpSolid').style.display = t === 'solid' ? 'block' : 'none'; $('wpGradient').style.display = t === 'gradient' ? 'block' : 'none'; };
        $('wpBlur').oninput = function() { $('blurVal').textContent = $('wpBlur').value + 'px'; };
        $('wpDim').oninput = function() { $('dimVal').textContent = $('wpDim').value + '%'; };
        var presetsContainer = $('gradientPresets');
        if (presetsContainer) {
            var presetsHtml = '';
            GRADIENT_PRESETS.forEach(function(preset) { presetsHtml += '<div class="gradient-preset' + (wp.gradient === preset.value ? ' selected' : '') + '" data-gradient="' + esc(preset.value) + '" style="background:' + preset.value + ';width:40px;height:40px;border-radius:6px;cursor:pointer;border:2px solid transparent" title="' + preset.name + '"></div>'; });
            presetsContainer.innerHTML = presetsHtml;
            presetsContainer.querySelectorAll('.gradient-preset').forEach(function(el) { el.onclick = function() { presetsContainer.querySelectorAll('.gradient-preset').forEach(function(p) { p.style.borderColor = 'transparent'; }); el.style.borderColor = 'var(--accent)'; $('wpGradientCustom').value = el.dataset.gradient; $('gradientPreview').style.background = el.dataset.gradient; }; });
        }
        if ($('wpGradientCustom')) { $('wpGradientCustom').oninput = function() { $('gradientPreview').style.background = $('wpGradientCustom').value; }; }
        $('impBonjour').onchange = async function(e) { var file = e.target.files[0]; if (!file) return; try { var data = JSON.parse(await file.text()); await fetch('/api/import/bonjour', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); toast('Imported!'); await loadData(); closeModal(); render(); } catch(err) { toast('Invalid file'); } };
        $('impBrowser').onchange = async function(e) { var file = e.target.files[0]; if (!file) return; try { var html = await file.text(); await fetch('/api/import/browser', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ html: html }) }); toast('Imported!'); await loadData(); closeModal(); render(); } catch(err) { toast('Invalid file'); } };
        $('saveSettings').onclick = async function() { 
            var wpType = $('wpType').value; 
            var gradient = wpType === 'gradient' ? ($('wpGradientCustom').value || GRADIENT_PRESETS[0].value) : ''; 
            
            // Preserve existing widget settings, just update visibility
            var widgets = appData.settings?.widgets || {};
            widgets.clock = { ...(widgets.clock || {}), visible: $('togClock').classList.contains('active') };
            widgets.calendar = { ...(widgets.calendar || {}), visible: $('togCalendar').classList.contains('active') };
            widgets.weather = { ...(widgets.weather || {}), visible: $('togWeather').classList.contains('active') };
            widgets.finance = { ...(widgets.finance || {}), visible: $('togFinance').classList.contains('active') };
            
            appData.settings = { 
                name: $('setName').value.trim(), 
                showSearch: $('togSearch').classList.contains('active'), 
                searchEngine: $('setEngine').value, 
                theme: $('setTheme').value, 
                wallpaper: { 
                    type: wpType, 
                    url: $('wpUrl').value, 
                    unsplashCategory: $('wpCategory').value, 
                    color: $('wpColor').value, 
                    gradient: gradient, 
                    blur: +$('wpBlur').value, 
                    dim: +$('wpDim').value 
                },
                widgets: widgets
            }; 
            await saveData('Settings saved'); 
            applyTheme(); 
            await loadWallpaper(); 
            updateWidgetVisibility();
            updateClockWidget();
            updateCalendarWidget();
            startWidgetTimers();
            closeModal(); 
        };
    }

    window.exportData = function() { const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `focus-backup-${new Date().toISOString().split('T')[0]}.json`; a.click(); toast('Exported!'); };

    function searchBookmarks(q) {
        if (!q || q.length < 2) { $('searchResults').classList.remove('show'); return; }
        q = q.toLowerCase(); const results = [];
        appData.categories?.forEach(cat => { (cat.links || []).forEach(l => { if (l.name.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)) results.push({ ...l, path: cat.name }); }); (cat.subfolders || []).forEach(f => { f.links.forEach(l => { if (l.name.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)) results.push({ ...l, path: `${cat.name} > ${f.name}` }); }); }); });
        if (!results.length) { $('searchResults').classList.remove('show'); return; }
        $('searchResults').innerHTML = results.slice(0, 8).map(r => { const icon = r.customIcon || getFavicon(r.url); return `<div class="search-result" onclick="window.open('${esc(r.url)}','_blank')"><img src="${icon || ''}" onerror="this.style.display='none'"><div class="search-result-info"><div class="search-result-name">${esc(r.name)}</div><div class="search-result-path">${esc(r.path)}</div></div></div>`; }).join('');
        $('searchResults').classList.add('show');
    }

    function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('toastContainer').appendChild(t); setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500); }

    function setupEvents() {
        let timer; $('searchInput').oninput = e => { clearTimeout(timer); timer = setTimeout(() => searchBookmarks(e.target.value), 150); };
        $('searchInput').onkeydown = e => { if (e.key === 'Enter') { $('searchResults').classList.remove('show'); if ($('searchInput').value.trim()) window.open(ENGINES[appData.settings?.searchEngine || 'brave'] + encodeURIComponent($('searchInput').value), '_blank'); } };
        $('searchInput').onblur = () => setTimeout(() => $('searchResults').classList.remove('show'), 200);
        $('settingsBtn').onclick = openSettings;
        $('fabBtn').onclick = () => openLinkModal(activeTab, activeSubfolder);
        $('modalOverlay').onclick = e => { if (e.target === $('modalOverlay')) closeModal(); };
        document.onkeydown = e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') { if (e.key === 'Escape') e.target.blur(); return; } if (e.key === '/') { e.preventDefault(); $('searchInput').focus(); } if (e.key === 'Escape') { closeModal(); $('contextMenu').classList.remove('show'); } };
        window.addEventListener('resize', () => setTimeout(updateTabScrollButtons, 100));
    }

    async function init() { 
        await loadData(); 
        applyTheme(); 
        await loadWallpaper(); 
        updateWidgetVisibility();
        updateClockWidget(); 
        updateCalendarWidget();
        setInterval(updateClockWidget, 1000); 
        startWidgetTimers();
        render(); 
        setupEvents(); 
    }
    init();
    </script>
</body>
</html>
